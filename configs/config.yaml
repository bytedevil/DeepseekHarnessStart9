# Configuració de l'agent DeepSeek Harness
# Versió: 0.4.0.1

agent:
  name: "DeepSeekHarness"
  version: "0.4.0.1"
  description: "Agent d'automatització amb models de Google AI Studio"

api:
  provider: "google"
  # Sense model fix: l'agent selecciona automàticament el millor model
  # gratuït disponible amb la teva clau. Pots forçar-ne un de concret de
  # tres maneres (per ordre de prioritat):
  #   1. Flag CLI:        python3 scripts/deepseek.py --model gemini-3.6-flash
  #   2. Variable entorn: export HARNESS_MODEL=gemini-3.6-flash
  #   3. Descomenta aquí: model: "gemini-3.6-flash"
  # model: ""
  api_key: "GOOGLE_API_KEY"

capabilities:
  web_search: true
  file_operations: true
  shell_execution: true

startos:
  mode: "auto"
  max_concurrent_tasks: 4
  timeout_seconds: 3600